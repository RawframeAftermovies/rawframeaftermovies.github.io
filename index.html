<script>
(function () {

  const headingSelector = [
    'h1', 'h2', 'h3', 'h4', 'h5', 'h6',
    '.mbr-section-title',
    '.mbr-card-title',
    '.card-title'
  ].join(',');

  function prepareText() {

    const walker = document.createTreeWalker(
      document.body,
      NodeFilter.SHOW_TEXT,
      {
        acceptNode: function(node) {
          if (!node.nodeValue.trim()) {
            return NodeFilter.FILTER_REJECT;
          }

          const parent = node.parentElement;

          if (
            !parent ||
            parent.closest(
              'script,style,noscript,textarea,input,select,svg,' +
              '.mbr-iconfont,.socicon,.iconfont-wrapper,.ca-char'
            )
          ) {
            return NodeFilter.FILTER_REJECT;
          }

          return NodeFilter.FILTER_ACCEPT;
        }
      }
    );

    const nodes = [];

    while (walker.nextNode()) {
      nodes.push(walker.currentNode);
    }

    nodes.forEach(function(node) {

      const parent = node.parentElement;
      let isHeading = !!parent.closest(headingSelector);

      if (parent.closest('.form5 .mbr-section-subtitle')) {
        isHeading = false;
      }

      if (parent.closest('button, .btn')) {
        isHeading = false;
      }

      const fragment = document.createDocumentFragment();

      for (const char of node.nodeValue) {

        if (/\s/.test(char)) {
          fragment.appendChild(document.createTextNode(char));
          continue;
        }

        const span = document.createElement('span');

        span.className = isHeading
          ? 'ca-char ca-heading'
          : 'ca-char ca-regular';

        span.textContent = char;
        fragment.appendChild(span);
      }

      node.parentNode.replaceChild(fragment, node);
    });
  }

  function updateEffect() {

    const isMobile = window.innerWidth <= 767;
    const center = window.innerWidth / 2;

    document.querySelectorAll('.ca-char').forEach(function(el) {

      const rect = el.getBoundingClientRect();

      if (!rect.width) return;

      const x = rect.left + rect.width / 2;

      const distance = Math.min(
        1,
        Math.abs(x - center) / center
      );

      const intensity = Math.pow(distance, 0.65);

      const maxOffset = isMobile
        ? (el.classList.contains('ca-heading') ? 7 : 1)
        : (el.classList.contains('ca-heading') ? 14 : 2);

      const offset = maxOffset * intensity;

      el.style.setProperty(
        '--ca-offset',
        offset.toFixed(2) + 'px'
      );
    });
  }

  function initialize() {
    prepareText();
    updateEffect();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initialize);
  } else {
    initialize();
  }

  window.addEventListener('load', updateEffect);
  window.addEventListener('resize', updateEffect);

})();
</script>

<script>
(function () {

  // Mobirise editor en preview overslaan
  const pageUrl = window.location.href.toLowerCase();

  if (
    pageUrl.includes("mobirise") ||
    pageUrl.includes("preview")
  ) {
    return;
  }

  // Dubbele installatie voorkomen
  if (window.rawframeVhsInstalled) return;
  window.rawframeVhsInstalled = true;

  function initializeRawframeVhs() {

    // VHS-overlay aanmaken
    const overlay = document.createElement("div");
    overlay.id = "rawframe-vhs";

    overlay.innerHTML =
      '<div class="rf-band"></div>' +
      '<div class="rf-black"></div>';

    document.body.appendChild(overlay);

    let navigating = false;

    function switchSource(destination) {

      if (navigating) return;

      navigating = true;

      overlay.classList.add("rf-active");

      window.setTimeout(function () {
        window.location.href = destination;
      }, 700);
    }

    // Alle interne paginalinks onderscheppen
    document.addEventListener("click", function (event) {

      if (
        event.defaultPrevented ||
        event.button !== 0 ||
        event.metaKey ||
        event.ctrlKey ||
        event.shiftKey ||
        event.altKey
      ) {
        return;
      }

      const target = event.target;

      if (!(target instanceof Element)) return;

      const link = target.closest("a[href]");

      if (!link) return;

      if (
        link.hasAttribute("download") ||
        (link.target && link.target !== "_self")
      ) {
        return;
      }

      const href = link.getAttribute("href");

      if (
        !href ||
        href.startsWith("#") ||
        /^(mailto:|tel:|javascript:)/i.test(href)
      ) {
        return;
      }

      let destination;

      try {
        destination = new URL(href, window.location.href);
      } catch (error) {
        return;
      }

      // Alleen interne links op rawframe.be
      if (destination.origin !== window.location.origin) {
        return;
      }

      // Geen overgang bij dezelfde pagina of een anker
      if (
        destination.pathname === window.location.pathname &&
        destination.search === window.location.search
      ) {
        return;
      }

      event.preventDefault();

      switchSource(destination.href);

    }, true);

  }

  if (document.readyState === "loading") {
    document.addEventListener(
      "DOMContentLoaded",
      initializeRawframeVhs
    );
  } else {
    initializeRawframeVhs();
  }

})();
</script>
